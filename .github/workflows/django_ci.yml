name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodni yuklab olish
      uses: actions/checkout@v4

    - name: Python muhitini sozlash
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Kutubxonalarni o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Migratsiyalarni tekshirish va Testlarni ishga tushirish
      env:
        SECRET_KEY: 'ci-secret-key-for-testing-only-12345'
        DEBUG: 'True'
        GEMINI_API_KEY: 'dummy-key-for-tests'
        BOT_TOKEN: 'dummy-bot-token-for-ci'
      run: |
        python manage.py test