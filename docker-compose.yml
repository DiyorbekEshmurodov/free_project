services:
  redis:
    image: redis:7-alpine
    container_name: lifegym_redis
    restart: always

  web:
    build: .
    container_name: lifegym_app
    restart: always
    # Avval migratsiya va static fayllar, so'ng Gunicorn
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=0
      # Umumiy kesh: login urinishlari, AI kvota va profil keshi barcha workerlarda bir xil
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis

  bot:
    build: .
    container_name: lifegym_bot
    restart: always
    command: python manage.py run_bot
    env_file:
      - .env
    environment:
      - DEBUG=0
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - media_volume:/app/media
    depends_on:
      - web
      - redis

volumes:
  media_volume:
  static_volume:
