{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/ai_response.css' %}">

<!-- Xavfsiz va barqaror CDN kutubxonalari -->
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<div class="analysis-wrapper">
    <!-- AI javobi kartasi -->
    <div class="ai-response-card">
        <h2 class="ai-title">{{ question_data.title }}</h2>

        {% if question_data.text %}
            <div class="ai-user-text">
                "{{ question_data.text }}"
            </div>
        {% endif %}

        <div id="ai-content" class="markdown-content"></div>
    </div>

    <!-- Tugma kartaning PASTIDAN joy oladi -->
    <div class="back-btn-wrapper">
        <a href="{% url 'cards_list' section_name=section_name %}" class="back-btn">
            ← Orqaga qaytish
        </a>
    </div>
</div>

<!-- AI javobini XSS hujumlaridan xavfsiz o'tkazish uchun JSON script -->
{{ ai_result|json_script:"ai-result-data" }}

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Django json_script'dan ma'lumotni xavfsiz olish
        const rawDataElement = document.getElementById('ai-result-data');

        if (rawDataElement) {
            const rawMarkdown = JSON.parse(rawDataElement.textContent);

            if (rawMarkdown) {
                // 1. Markdown matnni HTML ga o'giramiz
                const rawHtml = marked.parse(rawMarkdown);
                // 2. DOMPurify orqali barcha zararli JavaScript kodingizni tozalaymiz (XSS Himoyasi)
                const cleanHtml = DOMPurify.sanitize(rawHtml);
                // 3. Ekranga tozalangan xavfsiz HTML ni chiqaramiz
                document.getElementById('ai-content').innerHTML = cleanHtml;
            }
        }
    });
</script>
{% endblock %}
