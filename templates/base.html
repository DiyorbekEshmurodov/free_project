<!DOCTYPE html>
{% load static %}
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Life GYM{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- AOS Animatsiya Kutubxonasi -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- CSS Fayllar -->
    <link rel="stylesheet" href="{% static 'css/userbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/type.css' %}">

    <style>
        /* Global mobil cheklovlar va to'g'rilashlar */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden !important;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
        }

        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            main {
                padding: 0 10px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- YUQORI NAVBAR -->
    {% include 'userbar.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- JS FAYLLAR -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="{% static 'js/main.js' %}?v=1.2"></script>

    <script>
        // AOS Animatsiyani ishga tushirish
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof AOS !== 'undefined') {
                AOS.init({
                    duration: 800,
                    once: true
                });
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
